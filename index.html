---
title: "+1s"
layout: default
description: "从苏北出发，穿过工程、互联网与人工智能，持续学习，持续建造。"
---

<div class="container home-portrait">
    <section class="home-poster-section" aria-label="主题海报">
        <div class="swiper home-poster-swiper" id="homePosterSwiper">
            <div class="swiper-wrapper">
                <article class="swiper-slide home-poster-slide">
                    <div class="home-poster-frame">
                        <img src="{{site.baseurl}}/assets/images/poster-interstellar-civilization-v2.png" alt="月面基地、火箭与远方地球构成的星际文明海报" fetchpriority="high">
                        <div class="home-poster-caption"><i class="fas fa-rocket" aria-hidden="true"></i><h2>星际文明</h2></div>
                    </div>
                </article>
                <article class="swiper-slide home-poster-slide">
                    <div class="home-poster-frame">
                        <img src="{{site.baseurl}}/assets/images/poster-software-productivity-v2.png" alt="人与智能设备协同运转的未来城市软件生产力海报" loading="lazy">
                        <div class="home-poster-caption"><i class="fas fa-code" aria-hidden="true"></i><h2>软件生产力</h2></div>
                    </div>
                </article>
            </div>
            <button class="home-swiper-button home-swiper-prev" type="button" aria-label="上一张海报"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
            <button class="home-swiper-button home-swiper-next" type="button" aria-label="下一张海报"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
            <div class="swiper-pagination home-swiper-pagination" aria-label="选择海报"></div>
        </div>
    </section>

    <section class="home-journey" aria-labelledby="home-journey-title">
        <div class="home-section-head">
            <i class="fas fa-route" aria-hidden="true"></i>
            <h2 id="home-journey-title">个人经历路线图</h2>
        </div>

        <div class="journey-track">
            <article class="journey-stop">
                <div class="journey-card"><i class="fas fa-seedling" aria-hidden="true"></i><h3>来自苏北农村</h3></div>
                <div class="journey-node" aria-hidden="true"><i></i></div>
            </article>
            <article class="journey-stop">
                <div class="journey-card"><i class="fas fa-school" aria-hidden="true"></i><h3>省盐中求学</h3></div>
                <div class="journey-node" aria-hidden="true"><i></i></div>
            </article>
            <article class="journey-stop">
                <div class="journey-card"><i class="fas fa-university" aria-hidden="true"></i><h3>南京念大学</h3></div>
                <div class="journey-node" aria-hidden="true"><i></i></div>
            </article>
            <article class="journey-stop">
                <div class="journey-card"><i class="fas fa-plane" aria-hidden="true"></i><h3>法国工程师学校留学</h3></div>
                <div class="journey-node" aria-hidden="true"><i></i></div>
            </article>
            <article class="journey-stop">
                <div class="journey-card"><i class="fas fa-building" aria-hidden="true"></i><h3>上海互联网公司工作</h3></div>
                <div class="journey-node" aria-hidden="true"><i></i></div>
            </article>
            <article class="journey-stop journey-stop--current">
                <div class="journey-card"><i class="fas fa-rocket" aria-hidden="true"></i><h3>AI 时代创业</h3></div>
                <div class="journey-node" aria-hidden="true"><i></i></div>
            </article>
        </div>
    </section>

    <section class="home-roosts" aria-labelledby="home-roosts-title">
        <div class="home-section-head home-section-head--map">
            <i class="fas fa-map-marked-alt" aria-hidden="true"></i>
            <h2 id="home-roosts-title">狡兔三窟</h2>
        </div>
        <div id="lifeRoostsMap" class="home-roosts-map" role="region" aria-label="太平洋地图，标出上海、杭州、沙巴、新加坡、温哥华和魁北克三组长期居住目标"></div>
        <div class="home-roosts-legend" aria-label="长期居住目标图例">
            <span><i class="roost-dot roost-dot--yangtze"></i>上海 · 杭州</span>
            <span><i class="roost-dot roost-dot--sea"></i>沙巴 · 新加坡</span>
            <span><i class="roost-dot roost-dot--canada"></i>温哥华 · 魁北克</span>
        </div>
    </section>

    {% comment %}技术文章入口暂时隐藏，文章仍保留在 /blog.html。{% endcomment %}
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
    new Swiper('#homePosterSwiper', {
        effect: 'creative',
        speed: 760,
        grabCursor: true,
        keyboard: { enabled: true },
        navigation: { prevEl: '.home-swiper-prev', nextEl: '.home-swiper-next' },
        pagination: { el: '.home-swiper-pagination', clickable: true },
        creativeEffect: {
            prev: { shadow: true, translate: ['-18%', 0, -1], scale: .94 },
            next: { translate: ['100%', 0, 0] }
        }
    });

    var roosts = [
        { name: '上海', coordinates: [31.2304, 121.4737], group: 'yangtze' },
        { name: '杭州', coordinates: [30.2741, 120.1551], group: 'yangtze' },
        { name: '沙巴', coordinates: [5.9804, 116.0735], group: 'sea' },
        { name: '新加坡', coordinates: [1.3521, 103.8198], group: 'sea' },
        { name: '温哥华', coordinates: [49.2827, 236.8793], group: 'canada' },
        { name: '魁北克', coordinates: [46.8139, 288.7910], group: 'canada' }
    ];
    var groupColors = { yangtze: '#3563b8', sea: '#ef8354', canada: '#2f8b70' };
    var map = L.map('lifeRoostsMap', {
        center: [26, 195],
        zoom: window.matchMedia('(max-width: 575px)').matches ? 1 : 2,
        minZoom: 1,
        maxZoom: 7,
        worldCopyJump: true,
        scrollWheelZoom: false
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    ['yangtze', 'sea', 'canada'].forEach(function (group) {
        var places = roosts.filter(function (place) { return place.group === group; });
        L.polyline(places.map(function (place) { return place.coordinates; }), {
            color: groupColors[group], weight: 3, opacity: .72, dashArray: '7 8'
        }).addTo(map);
    });

    roosts.forEach(function (place) {
        var icon = L.divIcon({
            className: 'roost-marker-shell',
            html: '<span class="roost-marker roost-marker--' + place.group + '"><i></i><b>' + place.name + '</b></span>',
            iconSize: [92, 36],
            iconAnchor: [16, 18]
        });
        L.marker(place.coordinates, { icon: icon, title: place.name, alt: place.name }).addTo(map);
    });
})();
</script>

<style>
.home-portrait { max-width:1500px!important; padding-bottom:4rem; }
.home-poster-section { margin-top:.55rem; }
.home-poster-swiper { background:#0b1018; border:1px solid #263146; border-radius:18px; box-shadow:0 22px 48px rgba(12,18,28,.26); height:min(54vw,790px); min-height:520px; overflow:hidden; }
.home-poster-slide,.home-poster-frame { height:100%; }
.home-poster-frame { background:#101827; overflow:hidden; position:relative; }
.home-poster-frame::after { background:linear-gradient(180deg,rgba(7,11,18,0) 56%,rgba(7,11,18,.82)); content:""; inset:0; pointer-events:none; position:absolute; }
.home-poster-frame img { height:100%; object-fit:cover; width:100%; }
.home-poster-caption { align-items:center; bottom:1.75rem; display:flex; gap:.8rem; left:1.8rem; position:absolute; z-index:2; }
.home-poster-caption i { align-items:center; backdrop-filter:blur(10px); background:rgba(10,18,30,.58); border:1px solid rgba(255,255,255,.32); border-radius:50%; color:#f3a683; display:flex; height:46px; justify-content:center; width:46px; }
.home-poster-caption h2 { color:#fff; font-family:Lora,Georgia,serif; font-size:clamp(2rem,4vw,3.4rem); letter-spacing:-.04em; margin:0; }
.home-swiper-button { align-items:center; backdrop-filter:blur(10px); background:rgba(13,22,38,.72); border:1px solid rgba(255,255,255,.36); border-radius:50%; color:#fff; cursor:pointer; display:flex; height:46px; justify-content:center; position:absolute; top:50%; transform:translateY(-50%); transition:background .2s ease,border-color .2s ease; width:46px; z-index:3; }
.home-swiper-button:hover { background:#ef8354; border-color:#ef8354; color:#17233b; }
.home-swiper-prev { left:1rem; }.home-swiper-next { right:1rem; }
.home-swiper-button.swiper-button-disabled { opacity:.25; pointer-events:none; }
.home-swiper-pagination { bottom:1rem!important; left:auto!important; right:1.5rem!important; text-align:right; width:auto!important; z-index:4; }
.home-swiper-pagination .swiper-pagination-bullet { background:#fff; height:8px; opacity:.55; transition:width .25s ease,opacity .25s ease; width:8px; }
.home-swiper-pagination .swiper-pagination-bullet-active { background:#ef8354; border-radius:999px; opacity:1; width:28px; }
.home-journey,.home-roosts { background:#f4f6f9; border:1px solid #d9e0e9; border-radius:16px; margin-top:1.4rem; overflow:hidden; padding:1.5rem; }
.home-section-head { align-items:center; display:flex; gap:.65rem; margin-bottom:.35rem; }

.home-section-head h2 { color:#17233b; font-family:Lora,Georgia,serif; font-size:1.45rem; margin:0; }
.journey-track { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); min-height:340px; position:relative; }
.journey-track::before { background:linear-gradient(90deg,#8090aa,#3563b8 58%,#ef8354); content:""; height:3px; left:3%; position:absolute; right:3%; top:50%; transform:translateY(-50%); }
.journey-track::after { border-bottom:5px solid transparent; border-left:8px solid #ef8354; border-top:5px solid transparent; content:""; position:absolute; right:2.4%; top:calc(50% - 5px); }
.journey-stop { display:grid; grid-template-rows:1fr 44px 1fr; min-width:0; padding:0 .35rem; position:relative; }
.journey-card { align-items:center; align-self:end; background:#fff; border:1px solid #d9e0e9; border-radius:11px; box-shadow:0 7px 17px rgba(23,35,59,.07); display:flex; flex-direction:column; grid-row:1; justify-content:center; margin-bottom:.65rem; min-height:102px; padding:.8rem; text-align:center; }

.journey-stop--current .journey-card { background:#17233b; border-color:#17233b; }.journey-stop--current .journey-card > i { color:#ef8354; }.journey-stop--current .journey-card h3 { color:#fff; }.journey-stop--current .journey-node i { border-color:#ef8354; }
.home-section-head--map { margin-bottom:1rem; }
.home-roosts-map { background:#dce6ef; border:1px solid #cad4df; border-radius:12px; height:500px; overflow:hidden; z-index:1; }
.home-roosts-map .leaflet-control-zoom a { color:#17233b; }.home-roosts-map .leaflet-control-attribution { font-size:9px; }
.roost-marker-shell { background:transparent; border:0; }
.roost-marker { align-items:center; display:flex; filter:drop-shadow(0 4px 6px rgba(20,30,45,.2)); gap:.45rem; white-space:nowrap; }
.roost-marker > i { border:4px solid #fff; border-radius:50% 50% 50% 0; display:block; height:25px; transform:rotate(-45deg); width:25px; }
.roost-marker > b { background:#17233b; border-radius:999px; color:#fff; font-size:.72rem; line-height:1; padding:.42rem .58rem; }
.roost-marker--yangtze > i { background:#3563b8; }.roost-marker--sea > i { background:#ef8354; }.roost-marker--canada > i { background:#2f8b70; }
.home-roosts-legend { display:flex; flex-wrap:wrap; gap:.7rem 1.5rem; justify-content:center; padding:1rem .25rem 0; }
.home-roosts-legend span { align-items:center; color:#334158; display:flex; font-size:.78rem; font-weight:700; gap:.45rem; }
.roost-dot { border-radius:50%; display:inline-block; height:9px; width:9px; }.roost-dot--yangtze { background:#3563b8; }.roost-dot--sea { background:#ef8354; }.roost-dot--canada { background:#2f8b70; }
@media (max-width:991px) { .home-poster-swiper { height:min(56vw,520px); min-height:0; }.journey-track { grid-template-columns:repeat(3,minmax(0,1fr)); min-height:auto; padding-top:1rem; }.journey-track::before,.journey-track::after { display:none; }.journey-stop { grid-template-rows:36px auto; padding:.35rem; }.journey-card,.journey-stop:nth-child(even) .journey-card { align-self:stretch; grid-row:2; margin:.25rem 0 0; }.journey-node,.journey-stop:nth-child(even) .journey-node { grid-row:1; }.journey-stop::before { background:#b8c3d3; content:""; height:2px; left:0; position:absolute; right:0; top:22px; }.journey-card { min-height:100px; }.home-roosts-map { height:430px; } }
@media (max-width:575px) { .home-portrait { padding-left:10px; padding-right:10px; }.home-poster-section { margin-top:.35rem; }.home-poster-swiper { border-radius:12px; height:clamp(210px,56vw,290px); }.home-poster-caption { bottom:.8rem; gap:.5rem; left:.8rem; }.home-poster-caption i { height:32px; width:32px; }.home-poster-caption h2 { font-size:1.35rem; }.home-swiper-button { height:34px; width:34px; }.home-swiper-prev { left:.55rem; }.home-swiper-next { right:.55rem; }.home-swiper-pagination { bottom:.55rem!important; right:.7rem!important; }.home-journey,.home-roosts { margin-top:1rem; padding:1.15rem; }.home-section-head h2 { font-size:1.25rem; }.journey-track { display:block; padding:1rem 0 0 2.8rem; }.journey-track::before { background:linear-gradient(#8090aa,#3563b8 58%,#ef8354); bottom:1.2rem; display:block; height:auto; left:1rem; right:auto; top:1.4rem; transform:none; width:3px; }.journey-stop { display:block; padding:0 0 .75rem; }.journey-stop::before { display:none; }.journey-card,.journey-stop:nth-child(even) .journey-card { align-items:flex-start; flex-direction:row; gap:.65rem; justify-content:flex-start; margin:0; min-height:0; padding:.85rem; text-align:left; }.journey-card h3 { margin:0; }.journey-node,.journey-stop:nth-child(even) .journey-node { left:-2.55rem; position:absolute; top:.9rem; }.journey-node i { box-shadow:0 0 0 5px #f4f6f9; }.home-roosts-map { height:390px; }.home-roosts-legend { justify-content:flex-start; } }
@media (prefers-reduced-motion:reduce) { .home-poster-swiper * { transition-duration:0s!important; } }
</style>
