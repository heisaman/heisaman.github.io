<script>
(function () {
    var stage = document.getElementById('homeShutters');
    var panels = Array.prototype.slice.call(stage.querySelectorAll('.home-shutter'));
    var legendButtons = Array.prototype.slice.call(document.querySelectorAll('[data-poster-target]'));
    var previous = document.getElementById('homePosterPrev');
    var next = document.getElementById('homePosterNext');
    var state = { index: 0, startX: 0, deltaX: 0, dragging: false, suppressClick: false };

    function activate(index) {
        state.index = Math.max(0, Math.min(index, panels.length - 1));
        panels.forEach(function (panel, panelIndex) {
            var active = panelIndex === state.index;
            panel.classList.toggle('is-active', active);
            panel.setAttribute('aria-expanded', active ? 'true' : 'false');
        });
        legendButtons.forEach(function (button, buttonIndex) {
            var active = buttonIndex === state.index;
            button.classList.toggle('is-active', active);
            button.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        previous.disabled = state.index === 0;
        next.disabled = state.index === panels.length - 1;
    }

    panels.forEach(function (panel, index) {
        panel.addEventListener('click', function (event) {
            if (state.suppressClick) {
                event.preventDefault();
                state.suppressClick = false;
                return;
            }
            activate(index);
        });
    });
    legendButtons.forEach(function (button) {
        button.addEventListener('click', function () { activate(Number(button.getAttribute('data-poster-target'))); });
    });
    previous.addEventListener('click', function () { activate(state.index - 1); });
    next.addEventListener('click', function () { activate(state.index + 1); });
    stage.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowLeft') { event.preventDefault(); activate(state.index - 1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); activate(state.index + 1); }
        if (event.key === 'Home') { event.preventDefault(); activate(0); }
        if (event.key === 'End') { event.preventDefault(); activate(panels.length - 1); }
    });
    stage.addEventListener('pointerdown', function (event) {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        state.startX = event.clientX;
        state.deltaX = 0;
        state.dragging = true;
        stage.setPointerCapture(event.pointerId);
    });
    stage.addEventListener('pointermove', function (event) {
        if (!state.dragging) return;
        state.deltaX = event.clientX - state.startX;
    });
    function finishGesture(event) {
        if (!state.dragging) return;
        state.dragging = false;
        if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
        if (Math.abs(state.deltaX) < 55) return;
        state.suppressClick = true;
        activate(state.deltaX < 0 ? state.index + 1 : state.index - 1);
        window.setTimeout(function () { state.suppressClick = false; }, 0);
    }
    stage.addEventListener('pointerup', finishGesture);
    stage.addEventListener('pointercancel', finishGesture);

    activate(0);
})();
</script>
