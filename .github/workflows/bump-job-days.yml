name: Bump job days

# 触发方式：
#   1) repository_dispatch —— 手机端下班打卡后发来的 HTTP 事件（正式用途）
#   2) workflow_dispatch   —— 在 GitHub Actions 页面手动点一下，用于测试
on:
  repository_dispatch:
    types: [dingtalk-checkout]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bump-job-days
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increment job days (每天仅一次)
        run: node .github/scripts/bump-job-days.js

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/data/progress.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/progress.json
            git commit -m "chore: 下班打卡 +1 天"
            git push
          else
            echo "无变化（今天已打过卡）。"
          fi
